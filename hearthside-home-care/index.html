  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            let totalLen = 0;

              const { done, value } = await reader.read();

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der-color:#5B3F73}\n@keyframes hsBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}\n.hs-breath{animation:hsBreath 8s ease-in-out infinite;transform-origin:50% 50%}\n@media (prefers-reduced-motion: reduce){.hs-breath{animation:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Figtree', 'Segoe UI', sans-serif; color: #2E2236; background: #FFFFFF; min-height: 100vh; overflow-x: hidden\" data-canvas-width=\"1440\" data-canvas-height=\"6200\" data-document-role=\"page\" data-label=\"Homepage\">\n\n  <!-- UTILITY BAR -->\n  <div style=\"background: #3F2A4D; color: #FAF7F2\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; font-size: 14px; font-weight: 600\">\n      <span>Concept build: a made-up business, built to show what's possible.<\u002Fspan>\n      <span style=\"color: #D9C8EC\">Caring for Newton, Rockdale &amp; Henry County families<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HEADER -->\n  <header style=\"background: #FFFFFF; border-bottom: 1px solid #EEE8F3\">\n    <nav aria-label=\"Main\" style=\"max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2E2236\">\n        <svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 42 42\" aria-hidden=\"true\"><circle cx=\"21\" cy=\"21\" r=\"20\" fill=\"#ECE5F3\"><\u002Fcircle><path d=\"M11 20 L21 11 L31 20 V31 H11 Z\" fill=\"none\" stroke=\"#3F2A4D\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M21 28.5s-4.6-2.9-4.6-6.1a2.5 2.5 0 0 1 4.6-1.4 2.5 2.5 0 0 1 4.6 1.4c0 3.2-4.6 6.1-4.6 6.1z\" fill=\"#8E6BB0\"><\u002Fpath><\u002Fsvg>\n        <span style=\"display: flex; flex-direction: column; line-height: 1.1\">\n          <span style=\"font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600\">Hearthside<\u002Fspan>\n          <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #4F6B50\">Home Care<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fa>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 26px; font-size: 16px; font-weight: 600\">\n        <a href=\"#services\" style=\"color: #3F3349; text-decoration: none\">Services<\u002Fa>\n        <a href=\"#steps\" style=\"color: #3F3349; text-decoration: none\">How it works<\u002Fa>\n        <a href=\"#areas\" style=\"color: #3F3349; text-decoration: none\">Areas served<\u002Fa>\n        <a href=\"#team\" style=\"color: #3F3349; text-decoration: none\">Our team<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 18px\">\n        <a href=\"#visit\" style=\"display: flex; flex-direction: column; text-decoration: none; line-height: 1.2\">\n          <span style=\"font-size: 13px; font-weight: 600; color: #5C5066\">We're here for you, 24/7<\u002Fspan>\n          <span style=\"font-size: 22px; font-weight: 800; color: #3F2A4D\">(770) 555-0142<\u002Fspan>\n        <\u002Fa>\n        <a href=\"#consult\" class=\"hs-btn\" style=\"display: inline-block; padding: 15px 24px; border-radius: 12px; background: #3F2A4D; color: #FFFFFF; text-decoration: none; font-weight: 700\">Free Consultation<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" style=\"background: #F7F3FA\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 64px 24px 140px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n      <div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n        <span style=\"font-size: 14px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #4F6B50\">In-home care · Covington, GA<\u002F 12px 14px; border-radius: 12px; background: #E3ECE1; color: #22311F; font-weight: 600\">Yes! We serve {{ city }}. <a href=\"#consult\">Book your free consultation →<\u002Fa><\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ cityOther }}\" hint-placeholder-val=\"{{ false }}\">\n            <p role=\"status\" style=\"margin: 0; padding: 12px 14px; border-radius: 12px; background: #F5F1F9; color: #3F2A4D; font-weight: 600\">We may still be able to help. Call (770) 555-0142 and we'll check for you.<\u002Fp>\n          <\u002Fsc-if>\n          <span style=\"font-size: 14px; color: #5C5066\">Or call us anytime: <a href=\"#visit\" style=\"font-weight: 700\">(770) 555-0142<\u002Fa><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Illustrated hero panel -->\n      <div style=\"flex: 1 1 380px; min-width: 0; display: flex; justify-content: center\">\n        <div style=\"position: relative; width: 440px; max-width: 100%; height: 460px; border-radius: 36px; background: #E8DFF1; overflow: hidden\">\n          <div class=\"hs-breath\" aria-hidden=\"true\" style=\"position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%; background: #F3EDF8\"><\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"position: absolute; left: -40px; bottom: -50px; width: 220px; height: 220px; border-radius: 50%; background: #DCE6DA\"><\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 400 360\" width=\"400\" height=\"360\" aria-hidden=\"true\" style=\"position: absolute; left: 50%; bottom: 0; margin-left: -200px; max-width: 100%\">\n            <path d=\"M70 160 L200 70 L330 160\" fill=\"none\" stroke=\"#3F2A4D\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M95 146 V320 H305 V146\" fill=\"#FFFFFF\" stroke=\"#3F2A4D\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpath>\n            <rect x=\"125\" y=\"176\" width=\"44\" height=\"44\" rx=\"8\" fill=\"#F5E9C9\" stroke=\ 5F3; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5C5066; font-weight: 700\">[Photo]<\u002Fdiv>\n        <span style=\"font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600\">Our caregivers<\u002Fspan>\n        <span style=\"font-size: 15px; color: #3F3349\">Neighbors from your own community<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FREE CONSULTATION -->\n  <section id=\"consult\" style=\"background: #F7F3FA\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n      <div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n        <span style=\"font-size: 14px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #4F6B50\">Free Consultation<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(2.2rem, 4.4vw, 3.4rem); line-height: 1.08\">Let's talk about your family. <em style=\"color: #5B3F73\">It's free.<\u002Fem><\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #3F3349\">No pressure and no commitment. Just honest answers and a plan that makes sense for your loved one.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; font-weight: 600\">\n          <span>✓ We'll call you back within one business day<\u002Fspan>\n          <span>✓ Free in-home assessment<\u002Fspan>\n          <span>✓ Private pay and long-term care insurance welcome<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#visit\" style=\"display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; text-decoration: none; max-width: 340px\">\n          <span style=\"font-size: 14px; font-weight: 600; color: #5C5066\">Prefer to talk now?<\u002Fspan>\n          <span style=\"font-size: 26px; font-weight: 800; color: #3F2A4D\">(770) 555-0142<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 420px; min-width: 0; padding: 32px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 20px 50px rgba(63,42,77,0.08); border-top: 6px solid #3F2A4D\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px\">\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">Your name<input class=\"hs-field\" type=\"text\" placeholder=\"Full name\"><\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">Phone<input class=\"hs-field\" type=\"tel\" placeholder=\"(770) 555-0100\"><\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">Who needs care?\n              <sc-raw-select class=\"hs-field\"><option>My mom or dad<\u002Foption><option>My spouse<\u002Foption><option>Myself<\u002Foption><option>Another loved one<\u002Foption><\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">What kind of help?\n              <sc-raw-select class=\"hs-field\"><option>Not sure yet<\u002Foption><option>A few hours a week<\u002Foption><option>Daily visits<\u002Foption><option>24-hour or live-in care<\u002Foption><option>Memory care support<\u002Foption><\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">Anything we should know? (optional)<textarea class=\"hs-field\" rows=\"3\" style=\"resize: vertical\"><\u002Ftextarea><\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" class=\"hs-btn\" style=\"min-height: 56px; border: none; border-radius: 12px; background: #3F2A4D; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 17px; font-weight: 800; cursor: pointer\">Request my Free Consultation<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 28px 8px\">\n            <span style=\"width: 64px; height: 64px; border-radius: 50%; background: #E3ECE1; display: flex; align-items: center; justify-content: center\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3F5A40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <h3 style=\"margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 500\">Thank you for reaching out.<\u002Fh3>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3F3349\">A care coordinator will call you within one business day. You're not doing this alone.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"min-height: 44px; padding: 10px 22px; border-radius: 12px; border: 1.5px solid #D8CDE3; background: #FFFFFF; color: #3F2A4D; font-family: 'Figtree', sans-serif; font-weight: 700; cursor: pointer\">Send another request<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer id=\"visit\" style=\"background: #2E2236; color: #E6DDEF\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 64px 24px 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 36px\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; color: #FFFFFF\">Hearthside Home Care<\u002Fspan>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6\">Compassionate in-home care for the people you love most.<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #C9BCD6\">Serving Covington, Oxford, Porterdale, Social Circle, Conyers, McDonough, Stockbridge, Hampton and Locust Grove.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n        <span style=\"font-weight: 800; color: #FFFFFF\">Office<\u002Fspan>\n        <span>Covington, GA<\u002Fspan>\n        <span>Mon – Fri · 8 AM – 6 PM<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n        <span style=\"font-weight: 800; color: #FFFFFF\">Care hours<\u002Fspan>\n        <span>24 hours a day, 7 days a week<\u002Fspan>\n        <span>On-call support after hours<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 600\">\n        <span style=\"font-weight: 800; color: #FFFFFF\">Contact<\u002Fspan>\n        <a href=\"#visit\" style=\"text-decoration: none; color: #D9C8EC\">(770) 555-0142<\u002Fa>\n        <a href=\"#consult\" style=\"text-decoration: none; color: #D9C8EC\">Free Consultation →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 20px 24px 30px; border-top: 1px solid #4A3D55; font-size: 14px; color: #C9BCD6\">© 2026 Hearthside Home Care · Concept build: a made-up business, built to show what's possible.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6200}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { sent: false, city: '' };\n  }\n  renderVals() {\n    const areas = ['Covington', 'Oxford', 'Porterdale', 'Social Circle', 'Conyers', 'McDonough', 'Stockbridge', 'Hampton', 'Locust Grove'];\n    const city = this.state.city;\n    return {\n      services: [\n        { name: 'Personal care', icon: 'M12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z M6 21v-4a6 6 0 0 1 12 0v4', desc: 'Gentle help with bathing, dressing, grooming and getting around safely.' },\n        { name: 'Companionship', icon: 'M4 5h16v10H9l-5 4z', desc: 'Conversation, card games, walks and a friendly face to share the day with.' },\n        { name: 'Meals & light housekeeping', icon: 'M4 11h16 M6 11a6 6 0 0 1 12 0 M5 15h14l-1 4H6z', desc: 'Healthy home-cooked meals, laundry and a tidy, safe home.' },\n        { name: 'Medication reminders', icon: 'M8.5 15.5l7-7a3.5 3.5 0 0 0-5-5l-7 7a3.5 3.5 0 0 0 5 5z M7 7l5 5', desc: 'Right medicine, right time, with updates for the family.' },\n        { name: 'Memory care support', icon: 'M9 4a4 4 0 0 0-4 4 4 4 0 0 0 1 7 3 3 0 0 0 6 2V4 M15 4a4 4 0 0 1 4 4 4 4 0 0 1-1 7 3 3 0 0 1-6 2', desc: 'Patient, trained care for loved ones living with dementia or Alzheimer’s.' },\n        { name: 'Respite care', icon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z', desc: 'Time off for family caregivers, from a few hours to a few days.' },\n        { name: 'Transportation & errands', icon: 'M5 16V9l2-4h10l2 4v7z M5 16v3 M19 16v3 M5 11h14', desc: 'Rides to appointments, pharmacy runs, groceries and church.' },\n        { name: '24-hour & live-in care', icon: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z M12 7v5l3 2', desc: 'Around-the-clock support so no one is ever alone overnight.' }\n      ],\n      areas: areas,\n      cityOptions: areas.concat(['Somewhere else']),\n      city: city,\n      cityYes: !!city && city !== 'Somewhere else',\n      cityOther: city === 'Somewhere else',\n      onCity: (e) => this.setState({ city: e.target.value }),\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      submit: () => this.setState({ sent: true }),\n      reset: () => this.setState({ sent: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
